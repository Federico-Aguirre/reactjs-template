# Configuración del servidor Nginx para Single Page Application (SPA).
server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # CLAVE SPA: Intenta cargar el archivo o carpeta solicitada ($uri).
        # Si no existe (ej. al recargar en /dashboard), entrega siempre index.html 
        # para que react-router-dom tome el control en el navegador y no devuelva error 404.
        try_files $uri $uri/ /index.html;
    }
}